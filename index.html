<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Artillery Passage</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="stage" inert>
        <canvas id="canvas"></canvas>
        <div id="hint">Drag to look around · Tap to reveal the Gaussians</div>
        <div id="view-controls">
            <button id="mute" type="button" aria-label="Sound" aria-pressed="true" data-muted="false">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M11 5 6 9H3v6h3l5 4z"/>
                    <g class="audio-on"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></g>
                    <g class="audio-off"><path d="m16 9 5 6m0-6-5 6"/></g>
                </svg>
            </button>
            <label class="quality-label">Quality <select id="quality" aria-label="Rendering quality">
                <option value="auto">Auto</option><option value="performance">Performance</option><option value="balanced">Balanced</option><option value="quality">Original (80 MB)</option>
            </select></label>
        </div>
    </div>

    <div id="overlay" class="loading">
        <div class="card">
            <div class="title">Artillery Passage</div>
            <div class="subtitle">Spitalfields, London</div>
            <div class="progress"><div class="bar"></div></div>
            <div class="status" role="status">Loading scene&hellip;</div>
            <button id="retry" type="button" hidden>Retry loading</button>
            <button id="play" type="button" aria-label="Play">
                <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
            </button>
            <div class="credit">Gaussian splat scan &ldquo;Artillery Passage&rdquo; by
                <a href="https://superspl.at/user/artfletch" target="_blank" rel="noopener">David Fletcher</a>,
                <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></div>
            <div class="keys">Drag to look around &middot; tap to reveal the Gaussians<br>F fullscreen &middot; M sound</div>
        </div>
    </div>

    <div id="hud"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
